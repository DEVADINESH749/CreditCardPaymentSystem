services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-credit_card_db}
      MYSQL_USER: ${MYSQL_USER:-credit_card_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-compose-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-compose-root-password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-django-secret-change-before-deployment}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-credit_card_db}
      MYSQL_USER: ${MYSQL_USER:-credit_card_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-compose-db-password}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  fastapi:
    build:
      context: ./backend
      dockerfile: payment_api/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: django_backend.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-django-secret-change-before-deployment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      PAYMENT_CORS_ALLOWED_ORIGINS: ${PAYMENT_CORS_ALLOWED_ORIGINS:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-credit_card_db}
      MYSQL_USER: ${MYSQL_USER:-credit_card_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-compose-db-password}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      django:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      DJANGO_PROXY_TARGET: http://django:8000
    ports:
      - "5173:5173"
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql_data: