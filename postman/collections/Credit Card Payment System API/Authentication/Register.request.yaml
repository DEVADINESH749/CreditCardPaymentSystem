$kind: http-request
url: "{{django_url}}/users/register/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test User",
      "email": "{{register_email}}",
      "password": "{{user_password}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('register_email', `postman-${Date.now()}@example.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Registration returns 201', () => pm.response.to.have.status(201));
      pm.test('Registration response excludes password', () => pm.expect(pm.response.json()).not.to.have.property('password'));
    language: text/javascript
order: 1000
